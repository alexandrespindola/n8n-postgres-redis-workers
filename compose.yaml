name: n8n-local

volumes:
  db_storage:
  n8n_storage:
  redis_storage:

x-n8n-shared: &n8n-shared
  image: n8nio/n8n:latest
  restart: always
  env_file:
    - .env
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_HOST=${N8N_HOST}
    - N8N_PROTOCOL=${N8N_PROTOCOL}
    - N8N_SECURE_COOKIE=false
    - N8N_EDITOR_BASE_URL=${N8N_PROTOCOL}://${N8N_HOST}
    - WEBHOOK_URL=${N8N_PROTOCOL}://${N8N_HOST}
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - QUEUE_HEALTH_CHECK_PORT=${QUEUE_HEALTH_CHECK_PORT:-5680}
    - N8N_NATIVE_PYTHON_RUNNER=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:-true}
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - CLAUDE_API_KEY=${CLAUDE_API_KEY}

x-runners-shared: &runners-shared
  build:
    context: .
    dockerfile: Dockerfile.runners
  restart: always
  shm_size: "2gb"
  read_only: true
  tmpfs:
    - /tmp:size=512m
    - /home/runner:size=256m

services:
  postgres:
    image: postgres:17
    restart: always
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    <<: *n8n-shared
    command: start
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 10

  n8n-worker:
    <<: *n8n-shared
    command: worker --concurrency=10
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5680/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  runners-main:
    <<: *runners-shared
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=30
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=2048
    depends_on:
      n8n:
        condition: service_healthy

  runners-worker:
    <<: *runners-shared
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=30
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=2048
    depends_on:
      n8n-worker:
        condition: service_healthy

  puppeteer-service:
    build:
      context: .
      dockerfile: Dockerfile.puppeteer
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
